name: Build Website APK
run-name: Build ${{ inputs.tag_name }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag_name:
        required: true
      app_name:
        required: true
      package_name:
        required: true
      version:
        required: true
      version_code:
        required: true
      permissions:
        required: false
        default: 'INTERNET'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Download website ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.inputs.tag_name }}" --pattern "website.zip" --repo "${{ github.repository }}"

      - name: Extract ZIP
        run: |
          mkdir -p android-template/app/src/main/assets/www
          mkdir -p temp_extract
          unzip -o website.zip -d temp_extract
          INDEX_PATH=$(find temp_extract -name "index.html" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "❌ ERROR: ZIP mein index.html nahi mila!"
            exit 1
          fi
          ROOT_DIR=$(dirname "$INDEX_PATH")
          cp -r "$ROOT_DIR"/* android-template/app/src/main/assets/www/

      - name: Setup Base Resources
        run: |
          mkdir -p android-template/app/src/main/res/values
          mkdir -p android-template/app/src/main/java/com/saiko/webapp
          
          echo '<?xml version="1.0" encoding="utf-8"?>' > android-template/app/src/main/res/values/styles.xml
          echo '<resources>' >> android-template/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar" />' >> android-template/app/src/main/res/values/styles.xml
          echo '</resources>' >> android-template/app/src/main/res/values/styles.xml

          echo '<?xml version="1.0" encoding="utf-8"?>' > android-template/app/src/main/res/values/strings.xml
          echo '<resources>' >> android-template/app/src/main/res/values/strings.xml
          echo '    <string name="app_name">MyApp</string>' >> android-template/app/src/main/res/values/strings.xml
          echo '</resources>' >> android-template/app/src/main/res/values/strings.xml

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android-template/app/src/main/res/mipmap-$density
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > android-template/app/src/main/res/mipmap-$density/ic_launcher.png
          done

      - name: Create AndroidManifest
        run: |
          PERMS="${{ github.event.inputs.permissions }}"
          echo '<?xml version="1.0" encoding="utf-8"?>' > android-template/app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> android-template/app/src/main/AndroidManifest.xml
          IFS=',' read -ra PERM_ARRAY <<< "$PERMS"
          for PERM in "${PERM_ARRAY[@]}"; do
            echo "    <uses-permission android:name=\"android.permission.$PERM\" />" >> android-template/app/src/main/AndroidManifest.xml
          done
          echo '    <application' >> android-template/app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> android-template/app/src/main/AndroidManifest.xml
          echo '        android:icon="@mipmap/ic_launcher"' >> android-template/app/src/main/AndroidManifest.xml
          echo '        android:label="@string/app_name"' >> android-template/app/src/main/AndroidManifest.xml
          echo '        android:supportsRtl="true"' >> android-template/app/src/main/AndroidManifest.xml
          echo '        android:usesCleartextTraffic="true"' >> android-template/app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/AppTheme">' >> android-template/app/src/main/AndroidManifest.xml
          echo '        <activity' >> android-template/app/src/main/AndroidManifest.xml
          echo '            android:name=".MainActivity"' >> android-template/app/src/main/AndroidManifest.xml
          echo '            android:exported="true"' >> android-template/app/src/main/AndroidManifest.xml
          echo '            android:configChanges="orientation|screenSize|keyboardHidden"' >> android-template/app/src/main/AndroidManifest.xml
          echo '            android:hardwareAccelerated="true">' >> android-template/app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> android-template/app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> android-template/app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> android-template/app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> android-template/app/src/main/AndroidManifest.xml
          echo '        </activity>' >> android-template/app/src/main/AndroidManifest.xml
          echo '    </application>' >> android-template/app/src/main/AndroidManifest.xml
          echo '</manifest>' >> android-template/app/src/main/AndroidManifest.xml

      - name: Create MainActivity.java
        run: |
          cat > android-template/app/src/main/java/com/saiko/webapp/MainActivity.java << 'EOF'
          package com.saiko.webapp;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingWebPermissionRequest;
              private static final int FILECHOOSER_RESULTCODE = 1001;
              private static final int PERMISSION_REQUEST_CODE = 1002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (hasPermissions()) {
                                      request.grant(request.getResources());
                                  } else {
                                      pendingWebPermissionRequest = request;
                                      requestPermissions();
                                  }
                              }
                          });
                      }
                  });

                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              private boolean hasPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      return checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED &&
                             checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                  }
                  return true;
              }

              private void requestPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      requestPermissions(new String[]{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.CAMERA,
                              Manifest.permission.MODIFY_AUDIO_SETTINGS,
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, PERMISSION_REQUEST_CODE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQUEST_CODE) {
                      if (pendingWebPermissionRequest != null) {
                          boolean allGranted = true;
                          for (int result : grantResults) {
                              if (result != PackageManager.PERMISSION_GRANTED) {
                                  allGranted = false;
                                  break;
                              }
                          }
                          if (allGranted) {
                              pendingWebPermissionRequest.grant(pendingWebPermissionRequest.getResources());
                          } else {
                              pendingWebPermissionRequest.deny();
                          }
                          pendingWebPermissionRequest = null;
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, intent));
                          filePathCallback = null;
                      }
                  } else {
                      super.onActivityResult(requestCode, resultCode, intent);
                  }
              }
          }
          EOF

      - name: Inject App Details & Icon
        run: |
          cd android-template
          PKG="${{ github.event.inputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          APP_NAME="${{ github.event.inputs.app_name }}"
          
          sed -i "s/namespace .*/namespace '$PKG'/" app/build.gradle
          sed -i "s/applicationId .*/applicationId \"$PKG\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version }}\"/" app/build.gradle
          sed -i "s/MyApp/$APP_NAME/g" app/src/main/res/values/strings.xml
          
          mkdir -p app/src/main/java/$PKG_PATH
          if [ -d "app/src/main/java/com/saiko/webapp" ]; then
              cp -r app/src/main/java/com/saiko/webapp/* app/src/main/java/$PKG_PATH/
              rm -rf app/src/main/java/com/saiko/webapp
          fi
          find app/src/main/java -name "*.java" -exec sed -i "s/package com.saiko.webapp;/package $PKG;/g" {} +
          
          # ✅ ICON REPLACE LOGIC (Agar frontend se icon aaya hai)
          if [ -f "app/src/main/assets/www/icon.png" ]; then
              echo "Custom icon mil gaya, replace kar rahe hain..."
              for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
                  cp "app/src/main/assets/www/icon.png" "app/src/main/res/mipmap-$density/ic_launcher.png"
              done
          fi

      - name: Build APK
        run: |
          cd android-template
          gradle assembleDebug

      - name: Rename APK
        run: |
          mv android-template/app/build/outputs/apk/debug/app-debug.apk android-template/app/build/outputs/apk/debug/Saiko-APK-${{ github.event.inputs.tag_name }}.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.tag_name }}" "android-template/app/build/outputs/apk/debug/Saiko-APK-${{ github.event.inputs.tag_name }}.apk" --repo "${{ github.repository }}" --clobber
