name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag_name:
        required: true
      app_name:
        required: true
      package_name:
        required: true
      version:
        required: true
      version_code:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9' 

      - name: Download website ZIP using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.inputs.tag_name }}" --pattern "website.zip" --repo "${{ github.repository }}"

      - name: Extract ZIP safely
        run: |
          mkdir -p android-template/app/src/main/assets
          mkdir -p temp_extract
          unzip -o website.zip -d temp_extract
          
          INDEX_PATH=$(find temp_extract -name "index.html" | head -n 1)
          
          if [ -z "$INDEX_PATH" ]; then
            echo "❌ ERROR: ZIP mein kahin bhi index.html nahi mila!"
            exit 1
          fi
          
          ROOT_DIR=$(dirname "$INDEX_PATH")
          cp -r "$ROOT_DIR"/* android-template/app/src/main/assets/
          echo "✅ Website assets ready (Folder structure fixed)"

      - name: Inject app settings
        run: |
          cd android-template
          sed -i "s/__APP_NAME__/${{ github.event.inputs.app_name }}/g" app/build.gradle
          sed -i "s/__PACKAGE_NAME__/${{ github.event.inputs.package_name }}/g" app/build.gradle
          sed -i "s/__VERSION_NAME__/${{ github.event.inputs.version }}/g" app/build.gradle
          sed -i "s/__VERSION_CODE__/${{ github.event.inputs.version_code }}/g" app/build.gradle
          echo "✅ Settings injected"

      - name: Build APK
        run: |
          cd android-template
          gradle assembleDebug

      # ✅ APK ka naam change karo upload se pehle (Backend ko isi naam ki talash thi)
      - name: Rename APK
        run: |
          mv android-template/app/build/outputs/apk/debug/app-debug.apk android-template/app/build/outputs/apk/debug/Saiko-APK-${{ github.event.inputs.tag_name }}.apk

      # ✅ Exact naam ke sath upload karo
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.tag_name }}" \
            android-template/app/build/outputs/apk/debug/Saiko-APK-${{ github.event.inputs.tag_name }}.apk \
            --repo "${{ github.repository }}" --clobber
