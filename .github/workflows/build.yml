name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag_name:
        required: true
      app_name:
        required: true
      package_name:
        required: true
      version:
        required: true
      version_code:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. JDK 17 setup (Android build ke liye zaroori)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3. Gradle wrapper check aur permission fix
      - name: Ensure Gradle wrapper exists and is executable
        run: |
          cd android-template
          if [ ! -f "gradlew" ]; then
            echo "❌ ERROR: android-template/gradlew file nahi mili! GitHub par check karo ki ye file exist karti hai ya nahi."
            exit 1
          fi
          chmod +x ./gradlew
          echo "✅ gradlew ready"

      # 4. Download ZIP from release
      - name: Download website ZIP
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.inputs.tag_name }}
          fileName: "website.zip"
          out-file-path: "."

      # 5. Extract ZIP safely
      - name: Extract ZIP
        run: |
          mkdir -p android-template/app/src/main/assets
          unzip -o website.zip -d android-template/app/src/main/assets
          if [ ! -f android-template/app/src/main/assets/index.html ]; then
            echo "❌ ERROR: ZIP ke root mein index.html nahi mila!"
            exit 1
          fi
          echo "✅ Website assets ready"

      # 6. Inject app settings
      - name: Inject app settings
        run: |
          cd android-template
          sed -i "s/__APP_NAME__/${{ github.event.inputs.app_name }}/g" app/build.gradle
          sed -i "s/__PACKAGE_NAME__/${{ github.event.inputs.package_name }}/g" app/build.gradle
          sed -i "s/__VERSION_NAME__/${{ github.event.inputs.version }}/g" app/build.gradle
          sed -i "s/__VERSION_CODE__/${{ github.event.inputs.version_code }}/g" app/build.gradle
          echo "✅ Settings injected"

      # 7. Build APK
      - name: Build APK
        run: |
          cd android-template
          ./gradlew assembleDebug

      # 8. Upload APK to release
      - name: Upload APK to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.repository.releases_url }}/tags/${{ github.event.inputs.tag_name }}
          asset_path: android-template/app/build/outputs/apk/debug/app-debug.apk
          asset_name: Saiko-APK-${{ github.event.inputs.tag_name }}.apk
          asset_content_type: application/vnd.android.package-archive
