name: Build Website APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag_name:
        required: true
      app_name:
        required: true
      package_name:
        required: true
      version:
        required: true
      version_code:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5' 

      # ✅ Yahan GitHub CLI use kiya hai jo 100% reliable hai
      - name: Download website ZIP using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.inputs.tag_name }}" --pattern "website.zip" --repo "${{ github.repository }}"

      - name: Extract ZIP
        run: |
          mkdir -p android-template/app/src/main/assets
          unzip -o website.zip -d android-template/app/src/main/assets
          if [ ! -f android-template/app/src/main/assets/index.html ]; then
            echo "❌ ERROR: ZIP ke root mein index.html nahi mila!"
            exit 1
          fi
          echo "✅ Website assets ready"

      - name: Inject app settings
        run: |
          cd android-template
          sed -i "s/__APP_NAME__/${{ github.event.inputs.app_name }}/g" app/build.gradle
          sed -i "s/__PACKAGE_NAME__/${{ github.event.inputs.package_name }}/g" app/build.gradle
          sed -i "s/__VERSION_NAME__/${{ github.event.inputs.version }}/g" app/build.gradle
          sed -i "s/__VERSION_CODE__/${{ github.event.inputs.version_code }}/g" app/build.gradle
          echo "✅ Settings injected"

      - name: Build APK
        run: |
          cd android-template
          gradle assembleDebug

      - name: Upload APK to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.repository.releases_url }}/tags/${{ github.event.inputs.tag_name }}
          asset_path: android-template/app/build/outputs/apk/debug/app-debug.apk
          asset_name: Saiko-APK-${{ github.event.inputs.tag_name }}.apk
          asset_content_type: application/vnd.android.package-archive
