name: Saiko APK Builder

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build request ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Uploaded Android Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Build Request
        run: |
          echo "Build request ID: ${{ inputs.run_id }}"
          echo "ERROR: Uploaded ZIP transfer is not connected yet."
          echo "The backend must securely transfer and extract the uploaded project."
          exit 1
