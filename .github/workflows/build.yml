name: Saiko APK Builder

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build ID"
        required: true
        type: string
      tag_name:
        description: "Release tag"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        type: string
      package_name:
        description: "Package name"
        required: true
        type: string
      version:
        description: "App version"
        required: true
        type: string
      version_code:
        description: "Version code"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Website APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Website ZIP
        env:
          GH_TOKEN: ${{ secrets.SAIKO_BUILDER_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saiko-input"

          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "website.zip" \
            --dir "$RUNNER_TEMP/saiko-input"

          test -s "$RUNNER_TEMP/saiko-input/website.zip"

      - name: Validate and Extract Website
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "saiko-input" / "website.zip"
          output = Path("website")

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()

              if len(entries) > 10000:
                  raise SystemExit("ZIP contains too many files")

              if sum(x.file_size for x in entries) > 200 * 1024 * 1024:
                  raise SystemExit("Website ZIP exceeds 200 MB extracted size")

              for item in entries:
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit("Unsafe ZIP path detected")

              z.extractall(output)

          if not (output / "index.html").is_file():
              raise SystemExit("ZIP ke root mein index.html hona chahiye.")
          PY

      - name: Prepare Android Project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/android-project"
          cp -a android-template/. "$RUNNER_TEMP/android-project/"

          cd "$RUNNER_TEMP/android-project"

          mkdir -p app/src/main/assets/www
          cp -a "$GITHUB_WORKSPACE/website/." app/src/main/assets/www/

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path.cwd()
          app_name = os.environ["APP_NAME"].strip()
          package_name = os.environ["PACKAGE_NAME"].strip()
          version_name = os.environ["VERSION_NAME"].strip()
          version_code = int(os.environ["VERSION_CODE"])

          if not app_name or len(app_name) > 40:
              raise SystemExit("Invalid app name")

          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", package_name):
              raise SystemExit("Invalid package name")

          if version_code < 1:
              raise SystemExit("Invalid version code")

          if not re.fullmatch(r"[A-Za-z0-9._+-]{1,20}", version_name):
              raise SystemExit("Invalid version name")

          gradle = root / "app/build.gradle"
          text = gradle.read_text()
          text = re.sub(r"namespace\s+['\"][^'\"]+['\"]", f"namespace '{package_name}'", text)
          text = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", f"applicationId '{package_name}'", text)
          text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", text)
          text = re.sub(r"versionName\s+['\"][^'\"]+['\"]", f"versionName '{version_name}'", text)
          gradle.write_text(text)

          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text()
          safe_name = (app_name.replace("&", "&amp;")
                               .replace("<", "&lt;")
                               .replace(">", "&gt;")
                               .replace('"', "&quot;"))
          text = re.sub(r'android:label="[^"]*"', f'android:label="{safe_name}"', text)
          manifest.write_text(text)

          java_file = root / "app/src/main/java/com/saiko/webapp/MainActivity.java"

          if package_name != "com.saiko.webapp":
              destination = root / "app/src/main/java" / Path(package_name.replace(".", "/"))
              destination.mkdir(parents=True, exist_ok=True)

              java_text = java_file.read_text()
              java_text = re.sub(
                  r"^package\s+[^;]+;",
                  f"package {package_name};",
                  java_text,
                  count=1,
                  flags=re.M
              )

              (destination / "MainActivity.java").write_text(java_text)
              java_file.unlink()
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ runner.temp }}/android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK to Build Release
        env:
          GH_TOKEN: ${{ secrets.SAIKO_BUILDER_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/android-project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          gh release upload "$TAG_NAME" "$APK#Saiko-APK-$RUN_ID.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saiko-APK-${{ inputs.run_id }}
          path: ${{ runner.temp }}/android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
