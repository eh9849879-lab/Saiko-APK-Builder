name: Saiko APK Builder

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build request ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Saiko APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Build Environment
        run: |
          java -version
          sdkmanager --list_installed
          echo "Build request: ${{ inputs.run_id }}"

      - name: Explain Next Step
        run: |
          echo "Build environment is ready."
          echo "Next, the uploaded website ZIP must be transferred here."
          echo "Then the workflow can package it into an Android WebView APK."
