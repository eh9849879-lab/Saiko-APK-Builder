name: Build Website APK
run-name: Build ${{ inputs.tag_name }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag_name:
        required: true
      app_name:
        required: true
      package_name:
        required: true
      version:
        required: true
      version_code:
        required: true
      permissions:
        required: false
        default: 'INTERNET'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9' 

      - name: Download website ZIP using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.inputs.tag_name }}" --pattern "website.zip" --repo "${{ github.repository }}"

      - name: Extract ZIP safely
        run: |
          mkdir -p android-template/app/src/main/assets/www
          mkdir -p temp_extract
          unzip -o website.zip -d temp_extract
          
          INDEX_PATH=$(find temp_extract -name "index.html" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "❌ ERROR: ZIP mein index.html nahi mila!"
            exit 1
          fi
          
          ROOT_DIR=$(dirname "$INDEX_PATH")
          cp -r "$ROOT_DIR"/* android-template/app/src/main/assets/www/

      - name: Create Missing Android Resources
        run: |
          PKG="${{ github.event.inputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          APP_NAME="${{ github.event.inputs.app_name }}"
          PERMS="${{ github.event.inputs.permissions }}"
          
          mkdir -p android-template/app/src/main/res/values
          mkdir -p android-template/app/src/main/java/$PKG_PATH
          
          cat << 'EOF' > android-template/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << EOF > android-template/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android-template/app/src/main/res/mipmap-$density
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > android-template/app/src/main/res/mipmap-$density/ic_launcher.png
          done

          # ✅ DYNAMIC PERMISSIONS INJECTOR
          cat << 'EOF' > android-template/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          EOF
          
          # Har permission ke liye line add karo
          IFS=',' read -ra PERM_ARRAY <<< "$PERMS"
          for PERM in "${PERM_ARRAY[@]}"; do
            echo "    <uses-permission android:name=\"android.permission.$PERM\" />" >> android-template/app/src/main/AndroidManifest.xml
          done
          
          # Baaki ka manifest code
          cat << 'EOF' >> android-template/app/src/main/AndroidManifest.xml
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          find android-template/app/src/main/java -name "*.java" -delete
          cat << EOF > android-template/app/src/main/java/$PKG_PATH/MainActivity.java
          package $PKG;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
              }
          }
          EOF

      - name: Inject App Details & Custom Icon
        run: |
          cd android-template
          PKG="${{ github.event.inputs.package_name }}"
          
          sed -i "s/namespace .*/namespace '$PKG'/" app/build.gradle
          sed -i "s/applicationId .*/applicationId \"$PKG\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version }}\"/" app/build.gradle
          
          # Icon Replace
          ICON_PATH=$(find app/src/main/assets/www -name "icon.png" | head -n 1)
          if [ ! -z "$ICON_PATH" ]; then
            find app/src/main/res -name "ic_launcher.png" -exec cp "$ICON_PATH" {} \;
          fi

      - name: Build APK
        run: |
          cd android-template
          gradle assembleDebug

      - name: Rename APK
        run: |
          mv android-template/app/build/outputs/apk/debug/app-debug.apk android-template/app/build/outputs/apk/debug/Saiko-APK-${{ github.event.inputs.tag_name }}.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.tag_name }}" \
            android-template/app/build/outputs/apk/debug/Saiko-APK-${{ github.event.inputs.tag_name }}.apk \
            --repo "${{ github.repository }}" --clobber
